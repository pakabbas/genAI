# GenAI on dd.spiralloopstechnologies.com — app is served at location /
# Port: genai-leadpilot.service → 127.0.0.1:8011
#
# CI/CD (deploy.yml) does NOT apply this file. Apply by hand, then reload nginx:
#   sudo cp deploy/nginx-dd-root.conf /etc/nginx/snippets/genai-dd-root.conf
#   # include the snippet from the dd vhost `server { ... }`
#   sudo nginx -t && sudo systemctl reload nginx
#
# Gemini 3 Pro + QC can exceed 5 minutes; 600s matches the client 540s abort.

location / {
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
}
