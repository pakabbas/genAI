# GenAI Creator Studio — nginx snippet for LeadPilot host
# Included from /etc/nginx/sites-enabled/leadpilotai.conf
# Proxies https://dd.spiralloopstechnologies.com/ → uvicorn :8010

location = /genAI {
    return 301 /genAI/;
}

location /genAI/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /genAI;
    # Gemini 3 Pro + QC revisions can exceed 5 minutes on complex briefs.
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
}
