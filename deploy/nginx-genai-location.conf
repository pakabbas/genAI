# LEGACY — LeadPilot /genAI/ subpath (port 8010). Production GenAI is now at the ROOT of
# dd.spiralloopstechnologies.com on port 8011. Use deploy/nginx-dd-root.conf instead.
# Deploy.yml does not apply nginx snippets; apply by hand + reload.

location = /genAI {
    return 301 /genAI/;
}

location /genAI/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /genAI;
    # Gemini 3 Pro + QC revisions can exceed 5 minutes on complex briefs.
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
}
