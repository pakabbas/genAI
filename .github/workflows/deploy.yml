name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-genai-production
  cancel-in-progress: true

env:
  APP_DIR: /home/muhamad_abbas/apps/genAI
  APP_PORT: "8010"
  APP_ROOT_PATH: /genAI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCP_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync application files
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ "${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_SSH_HOST }}:${APP_DIR}/"

      - name: Bootstrap server (nginx + systemd, idempotent)
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_SSH_HOST }}" \
            "cd '${APP_DIR}' && chmod +x deploy/*.sh && APP_DIR='${APP_DIR}' APP_PORT='${APP_PORT}' ./deploy/setup-server.sh"

      - name: Deploy application
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_SSH_HOST }}" \
            "cd '${APP_DIR}' && GEMINI_API_KEY='${GEMINI_API_KEY}' GEMINI_MODEL='${GEMINI_MODEL}' APP_DIR='${APP_DIR}' APP_PORT='${APP_PORT}' APP_ROOT_PATH='${APP_ROOT_PATH}' ./deploy/deploy.sh"

      - name: Verify public health endpoint
        run: |
          curl -fsS "https://leadpilotai.spiralloopstechnologies.com/genAI/api/health"
          echo
          curl -fsS -o /dev/null -w "Homepage HTTP %{http_code}\n" \
            "https://leadpilotai.spiralloopstechnologies.com/genAI/"
