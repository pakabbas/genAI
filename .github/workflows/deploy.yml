name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-genai-production
  cancel-in-progress: true

env:
  APP_DIR: /var/www/html/leadpilotai/genai
  SERVICE_NAME: genai-leadpilot.service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Actions secrets
        run: |
          missing=0
          if [ -z "${{ secrets.GCP_SSH_HOST }}" ]; then
            echo "::error::Missing repository secret GCP_SSH_HOST (GitHub → Settings → Secrets → Actions)"
            missing=1
          fi
          if [ -z "${{ secrets.GCP_SSH_USER }}" ]; then
            echo "::error::Missing repository secret GCP_SSH_USER"
            missing=1
          fi
          if [ -z "${{ secrets.GCP_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing repository secret GCP_SSH_PRIVATE_KEY"
            missing=1
          fi
          exit "$missing"

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          python3 deploy/write_ssh_key.py ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCP_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync application files
        run: |
          rsync -rlptDz \
            --no-owner --no-group \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.mypy_cache' \
            --exclude '.ruff_cache' \
            --exclude '*.pyc' \
            --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ "${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_SSH_HOST }}:${APP_DIR}/"

      - name: Install dependencies and restart service
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_SSH_HOST }}" bash -s << 'REMOTE_SCRIPT'
            set -euo pipefail
            APP_DIR="/var/www/html/leadpilotai/genai"
            SERVICE_NAME="genai-leadpilot.service"

            cd "${APP_DIR}"

            # Ensure virtualenv exists
            if [[ ! -d .venv ]]; then
              echo "==> Creating virtualenv"
              python3 -m venv .venv
            fi

            echo "==> Installing Python dependencies"
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -r requirements.txt

            # Fix ownership: SSH user owns files (for rsync), www-data group (for service)
            echo "==> Setting ownership to pakabbas52:www-data"
            sudo chown -R pakabbas52:www-data "${APP_DIR}"
            sudo chmod g+rwxs "${APP_DIR}"

            echo "==> Restarting ${SERVICE_NAME}"
            sudo systemctl restart "${SERVICE_NAME}"
            sleep 2

            echo "==> Checking service status"
            if sudo systemctl is-active --quiet "${SERVICE_NAME}"; then
              echo "Service is active"
            else
              echo "::error::Service ${SERVICE_NAME} failed to start"
              sudo systemctl status "${SERVICE_NAME}" --no-pager || true
              sudo journalctl -u "${SERVICE_NAME}" --no-pager -n 30 || true
              exit 1
            fi
          REMOTE_SCRIPT

      - name: Verify deployment
        run: |
          echo "==> Checking health endpoint"
          curl -fsS "https://leadpilotai.spiralloopstechnologies.com/genai/api/health"
          echo
          echo "==> Checking homepage"
          curl -fsS -o /dev/null -w "Homepage HTTP %{http_code}\n" \
            "https://leadpilotai.spiralloopstechnologies.com/genai/"
